<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense Tracker</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-gradient-to-br from-indigo-50 to-purple-100 py-10 min-h-screen">

  <div class="max-w-xl mx-auto bg-white shadow-2xl rounded-2xl p-8 border border-gray-200">

    <!-- Title -->
    <h1 class="text-4xl font-extrabold text-center text-indigo-700 mb-8 tracking-wide drop-shadow">
      💰 Expense Tracker
    </h1>

    <!-- Balance Overview -->
    <div class="bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-2xl p-6 mb-8 shadow-lg">
      <p class="text-2xl font-semibold flex justify-between">
        Balance:
        <span>₹<span id="balance">0</span></span>
      </p>
      <div class="flex justify-between mt-4">
        <p class="text-green-200 font-medium">Income: ₹<span id="income">0</span></p>
        <p class="text-red-200 font-medium">Expense: ₹<span id="expense">0</span></p>
      </div>
    </div>

    <!-- Input Section -->
    <div class="space-y-4">

      <input id="text"
        class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"
        type="text" placeholder="Enter title" />

      <input id="amount"
        class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400"
        type="number" placeholder="Amount" />

      <select id="category"
        class="w-full p-3 border rounded-xl focus:ring-2 focus:ring-indigo-400 focus:border-indigo-400">
        <option value="Food">Food</option>
        <option value="Travel">Travel</option>
        <option value="Accommodation">Accommodation</option>
        <option value="Shopping">Shopping</option>
        <option value="Salary">Salary</option>
        <option value="Other">Other</option>
      </select>

      <button id="add-btn"
        class="w-full bg-indigo-600 text-white py-3 rounded-xl hover:bg-indigo-700 hover:shadow-lg transition-all font-semibold">
        ➕ Add Transaction
      </button>
    </div>

    <!-- Transaction List -->
    <div class="mt-6">
      <h2 class="text-xl font-bold text-gray-700 mb-3">Transaction History</h2>
      <ul id="list" class="space-y-3"></ul>
    </div>

    <!-- Chart Section -->
    <div class="mt-8 bg-white p-4 border rounded-xl shadow">
      <h2 class="text-xl font-bold text-gray-700 mb-3">Expense Breakdown</h2>
      <canvas id="expenseChart"></canvas>
    </div>

  </div>

  <script src="script.js"></script>
</body>

</html>
